<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ title or 'Admin - Utixo Copilot' }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/admin.css" />
</head>
<body>
  <header class="admin-topbar">
    <div class="admin-topbar-inner">
      <div class="admin-brand">
        <span class="admin-dot"></span>
        <strong>Utixo Copilot</strong>
        <span class="admin-badge">Admin</span>
      </div>
      <nav class="admin-nav" aria-label="Navigazione admin">
        <a href="/admin" {% if active=='report' %}aria-current="page"{% endif %}>Report</a>
        <a href="/admin/faqs" {% if active=='faqs' %}aria-current="page"{% endif %}>FAQ</a>
        <a href="/admin/logout" class="admin-nav-danger">Logout</a>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    {% block content %}{% endblock %}
  </main>

  <script src="/static/admin.js" defer></script>
</body>
</html>
